        // 显示输入对话框
        function showInputDialog(prompt) {
            return new Promise((resolve) => {
                // 设置对话框提示
                document.getElementById('input-prompt').textContent = prompt || '请输入:';
                document.getElementById('input-value').value = '';
                document.getElementById('input-validation').style.display = 'none';
                
                // 显示对话框
                const dialog = document.getElementById('input-dialog');
                dialog.style.display = 'flex';
                
                // 聚焦输入框
                setTimeout(() => {
                    document.getElementById('input-value').focus();
                }, 100);
                
                // 验证输入
                const validateInput = () => {
                    const value = document.getElementById('input-value').value.trim();
                    const validationElement = document.getElementById('input-validation');
                    
                    if (value === '') {
                        validationElement.textContent = '输入不能为空，请输入有效的值';
                        validationElement.style.display = 'block';
                        return false;
                    }
                    
                    // 检查是否为有效数字（针对需要数字输入的情况）
                    if (prompt.includes('正整数') || prompt.includes('数字')) {
                        if (!/^\d+$/.test(value)) {
                            validationElement.textContent = '请输入有效的正整数';
                            validationElement.style.display = 'block';
                            return false;
                        }
                    }
                    
                    validationElement.style.display = 'none';
                    return true;
                };
                
                // 设置回调函数
                const handleSubmit = () => {
                    if (!validateInput()) {
                        return;
                    }
                    
                    const value = document.getElementById('input-value').value;
                    dialog.style.display = 'none';
                    resolve(value);
                    cleanup();
                };
                
                const handleCancel = () => {
                    dialog.style.display = 'none';
                    resolve(null); // 取消时返回null
                    cleanup();
                };
                
                const handleKeyPress = (e) => {
                    if (e.key === 'Enter') {
                        handleSubmit();
                    } else if (e.key === 'Escape') {
                        handleCancel();
                    }
                };
                
                // 清理事件监听器
                const cleanup = () => {
                    document.getElementById('input-submit').removeEventListener('click', handleSubmit);
                    document.getElementById('input-cancel').removeEventListener('click', handleCancel);
                    document.getElementById('input-value').removeEventListener('keydown', handleKeyPress);
                    document.getElementById('input-value').removeEventListener('input', validateInput);
                };
                
                // 添加事件监听器
                document.getElementById('input-submit').addEventListener('click', handleSubmit);
                document.getElementById('input-cancel').addEventListener('click', handleCancel);
                document.getElementById('input-value').addEventListener('keydown', handleKeyPress);
                document.getElementById('input-value').addEventListener('input', validateInput);
            });
        }
        
        // 清理代码中的不可见字符
        function cleanCode(code) {
            // 替换全角空格为半角空格，移除其他不可见字符
            return code.replace(/\u3000/g, ' ').replace(/[^\x20-\x7E\u4e00-\u9fa5\n\r\t]/g, '');
        }
        
        // 运行Python代码
        async function runPythonCode() {
            if (!pyodideReady) {

            if (isRunning) {
                document.getElementById('output').textContent = '代码正在运行中，请稍候...';
                return;
            }
            
            isRunning = true;
            const originalCode = document.getElementById('code').value;
            const outputElement = document.getElementById('output');
            
            try {
                // 清理代码中的不可见字符
                const cleanedCode = cleanCode(originalCode);
                
                // 清空输出区域
                outputElement.textContent = '代码执行中...\n';
                
                // 使用新的方法：代码转换
                const processedCode = await convertInputCalls(cleanedCode);
                
                if (processedCode === null) {
                    outputElement.textContent = '❌ 代码执行被取消：输入为空或无效';
                    return;
                }
                
                // 执行转换后的代码
                await pyodide.runPythonAsync(processedCode);
                
            } catch (error) {
                outputElement.textContent += `\n❌ 错误: ${error.message}`;
            } finally {
                isRunning = false;
            }
        }
        
        // 转换代码中的input调用
        async function convertInputCalls(code) {
            const lines = code.split('\n');
            let processedLines = [];
            
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                
                // 检查是否包含input调用
                if (line.includes('input(')) {
                    // 提取完整的input调用（处理多行情况）
                    let fullInputLine = line;
                    let bracketCount = (line.match(/\(/g) || []).length - (line.match(/\)/g) || []).length;
                    
                    // 如果括号不匹配，继续读取下一行
                    let j = i;
                    while (bracketCount > 0 && j + 1 < lines.length) {
                        j++;
                        fullInputLine += '\n' + lines[j];
                        bracketCount += (lines[j].match(/\(/g) || []).length - (lines[j].match(/\)/g) || []).length;
                    }
                    
                    // 提取prompt
                    const promptMatch = fullInputLine.match(/input\(([^)]+)\)/);
                    let prompt = "请输入:";
                    if (promptMatch) {
                        const quoteMatch = promptMatch[1].match(/['"]([^'"]*)['"]/);
                        if (quoteMatch) {
                            prompt = quoteMatch[1];
                        }
                    }
                    
                    // 获取用户输入
                    const userInput = await showInputDialog(prompt);
                    
                    // 如果用户取消输入，返回null
                    if (userInput === null) {
                        return null;
                    }
                    
                    // 替换input调用
                    if (fullInputLine.includes('=') && fullInputLine.includes('input(')) {
                        // 变量赋值的情况
                        const assignmentParts = fullInputLine.split('=');
                        const varName = assignmentParts[0].trim();
                        const restOfLine = assignmentParts.slice(1).join('=');
                        const replacedRest = restOfLine.replace(/input\([^)]+\)/, `"${userInput}"`);
                        processedLines.push(`${varName} = ${replacedRest}`);
                    } else {
                        // 直接使用input的情况
                        const replacedLine = fullInputLine.replace(/input\([^)]+\)/, `"${userInput}"`);
                        processedLines.push(replacedLine);
                    }
                    
                    // 跳过已经处理的多行
                    if (j > i) {
                        i = j;
                    }
                } else {
                    processedLines.push(line);
                }
            }
            
            return processedLines.join('\n');
        }
