<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>高中信息技术 - Python 程序题闯关练习</title>
    <style>
        :root {
            --bg-main: #091220;
            --bg-panel: #131e33;
            --bg-code: #0a1423;
            --text-main: #c8d6e5;
            --text-accent: #00d4ff;
            --border-color: #1f3452;
            --highlight: #1b2e4a;
            --glow-shadow: 0 0 20px rgba(0, 212, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% 0%, #12203a 0%, var(--bg-main) 80%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
            flex-shrink: 0;
            width: 100%;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 10px;
            flex-wrap: wrap;
        }
        .header h1 {
            font-size: clamp(20px, 5vw, 28px);
            color: #ffffff;
            letter-spacing: 2px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
            flex: 1;
            text-align: center;
            margin: 0;
        }
        .header p {
            font-size: clamp(12px, 2.5vw, 14px);
            color: #8697a8;
            margin-top: 8px;
            letter-spacing: 0.5px;
            padding: 0 10px;
        }

        .btn-back {
            background: linear-gradient(135deg, #1f3a5f 0%, #2a5f7a 100%);
            color: #ffffff;
            border: 1px solid #3a7a9a;
            padding: 6px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: clamp(12px, 2vw, 14px);
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.1);
            white-space: nowrap;
        }
        .btn-back:hover {
            background: linear-gradient(135deg, #2a5f7a 0%, #3a8aaa 100%);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            transform: scale(1.02);
        }

        .main-container {
            display: flex;
            flex: 1;
            gap: 16px;
            height: auto;
            min-height: calc(100vh - 140px);
            flex-wrap: wrap;
        }

        .panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            flex: 1 1 0;
            min-width: 200px;
        }
        .panel::before {
            content: '';
            position: absolute;
            top: -1px; left: 20%; right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--text-accent), transparent);
            opacity: 0.6;
        }
        
        .panel-title {
            font-size: clamp(14px, 2.5vw, 16px);
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 14px;
            color: #ffffff;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }
        .panel-title::before {
            content: '';
            display: inline-block;
            width: 4px; height: 16px;
            background-color: var(--text-accent);
            border-radius: 2px;
            margin-right: 10px;
        }

        /* 左侧面板 - 导航网格 */
        .sidebar-left {
            flex: 0 0 220px;
            min-width: 160px;
        }
        .grid-nav {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .grid-nav button {
            background-color: #0f1b2c;
            border: 1px solid #1f3452;
            color: #a0b5c8;
            padding: 12px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: clamp(14px, 2.2vw, 16px);
            font-weight: 500;
        }
        .grid-nav button:hover {
            background-color: var(--highlight);
            border-color: var(--text-accent);
            color: #fff;
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.1);
        }
        .grid-nav button.active {
            background-color: var(--text-accent);
            color: #0a1423;
            border-color: var(--text-accent);
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .flowchart-box {
            margin-top: 16px;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0c1828;
            border-radius: 8px;
            min-height: 160px;
            padding: 8px;
            position: relative;
            font-size: 13px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .flow-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transform: scale(0.7);
            transform-origin: center center;
        }
        @media (max-width: 600px) {
            .flow-container { transform: scale(0.55); }
        }
        .flow-box { 
            border: 1px solid var(--text-accent); 
            padding: 4px 10px; 
            border-radius: 6px; 
            background: rgba(0, 212, 255, 0.05); 
            font-size: 12px; 
            color: var(--text-accent);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.05);
        }
        .flow-diamond { 
            border: 1px solid var(--text-accent); 
            padding: 2px; 
            transform: rotate(45deg); 
            width: 60px; height: 60px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: rgba(0, 212, 255, 0.05); 
            margin: 4px 0;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.05);
        }
        .flow-diamond span { transform: rotate(-45deg); font-size: 11px; color: var(--text-accent); line-height: 1.2; }
        .arrow-down { width: 2px; height: 14px; background: var(--text-accent); box-shadow: 0 0 6px var(--text-accent); }

        /* 中间内容 */
        .content-center {
            flex: 1 1 0;
            min-width: 280px;
        }
        .problem-title {
            font-size: clamp(18px, 3.5vw, 22px);
            margin-bottom: 10px;
            color: #fff;
            font-weight: bold;
            word-break: break-word;
        }
        .problem-desc {
            background: rgba(0, 212, 255, 0.04);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 16px;
            font-size: clamp(13px, 2vw, 15px);
            line-height: 1.7;
            color: #d0dce8;
        }
        .code-area {
            background-color: var(--bg-code);
            border-radius: 8px;
            padding: 16px 12px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: clamp(14px, 2.2vw, 16px);
            line-height: 2.2;
            position: relative;
            border: 1px solid var(--border-color);
            flex: 1;
            overflow-y: auto;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
            min-height: 300px;
        }
        .code-line {
            display: flex;
            align-items: baseline;
            white-space: pre-wrap;
            word-break: break-word;
            padding: 2px 0;
        }
        .line-num {
            color: #405e7a;
            width: 26px;
            text-align: right;
            margin-right: 12px;
            user-select: none;
            font-size: clamp(12px, 1.8vw, 14px);
            flex-shrink: 0;
        }
        .code-input {
            background: transparent;
            border: none;
            border-bottom: 2px dashed var(--text-accent);
            color: #ffffff;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: clamp(14px, 2.2vw, 16px);
            min-width: 80px;
            max-width: 160px;
            width: auto;
            padding: 0 4px;
            outline: none;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
            margin: 0 2px;
        }
        .code-input:focus {
            border-bottom: 2px solid #ffffff;
            box-shadow: 0 8px 12px -8px rgba(0, 212, 255, 0.3);
            min-width: 100px;
        }
        .code-input.correct {
            border-bottom-color: #4caf50;
            color: #4caf50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
        }
        .code-input.wrong {
            border-bottom-color: #f44336;
            color: #f44336;
            box-shadow: 0 0 10px rgba(244, 67, 54, 0.3);
        }

        .action-bar {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: clamp(13px, 2vw, 15px);
            transition: all 0.2s;
            font-weight: bold;
            flex: 1 1 auto;
            min-width: 60px;
            text-align: center;
        }
        .btn-prev, .btn-next {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: #a0b5c8;
        }
        .btn-prev:hover, .btn-next:hover {
            background-color: var(--highlight);
            border-color: var(--text-accent);
            color: #fff;
        }
        .btn-submit {
            background-color: var(--text-accent);
            color: #0a1423;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
            border: 1px solid transparent;
            flex: 2 1 auto;
        }
        .btn-submit:hover {
            background-color: #4ce1ff;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
            transform: scale(1.02);
        }

        /* 右侧面板 */
        .sidebar-right {
            flex: 0 0 300px;
            min-width: 220px;
        }
        .result-status {
            color: #ffffff;
            margin-bottom: 14px;
            font-size: clamp(13px, 2vw, 14px);
            padding: 10px 12px;
            background: rgba(0, 212, 255, 0.05);
            border-radius: 6px;
            border: 1px solid rgba(0, 212, 255, 0.1);
        }
        .correct-answer-box {
            background-color: #0e1c2e;
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 14px;
            border: 1px solid var(--border-color);
        }
        .correct-answer-box h4 {
            margin-bottom: 10px;
            color: var(--text-accent);
            font-size: clamp(13px, 2vw, 14px);
            letter-spacing: 0.5px;
        }
        .correct-answer-list {
            margin-left: 16px;
            list-style-type: decimal;
            color: #4caf50;
            font-family: 'Consolas', monospace;
            font-size: clamp(13px, 2vw, 14px);
        }
        .correct-answer-list li {
            margin-bottom: 4px;
        }
        .explanation-box {
            background-color: #0e1c2e;
            padding: 14px 16px;
            border-radius: 8px;
            color: #b0c4d8;
            font-size: clamp(13px, 2vw, 14px);
            line-height: 1.7;
            border: 1px solid var(--border-color);
        }
        .explanation-box strong {
            color: #ffffff;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3d5a78; }

        /* 响应式适配 */
        @media screen and (max-width: 1024px) {
            .sidebar-left { flex: 1 1 180px; min-width: 140px; }
            .sidebar-right { flex: 1 1 260px; min-width: 180px; }
            .main-container { gap: 12px; }
        }

        @media screen and (max-width: 768px) {
            body { padding: 8px; }
            .header { margin-bottom: 12px; }
            .header-top { justify-content: center; }
            .header h1 { font-size: clamp(18px, 4.5vw, 24px); }
            .btn-back { padding: 5px 14px; font-size: 12px; }
            .main-container {
                flex-direction: column;
                gap: 12px;
                min-height: auto;
            }
            .panel {
                padding: 14px;
                flex: 1 1 auto;
                min-height: auto;
            }
            .sidebar-left {
                flex: 1 1 auto;
                min-width: 0;
                order: 1;
            }
            .content-center {
                flex: 1 1 auto;
                min-width: 0;
                order: 2;
            }
            .sidebar-right {
                flex: 1 1 auto;
                min-width: 0;
                order: 3;
            }
            .grid-nav {
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
            }
            .grid-nav button {
                padding: 10px 0;
                font-size: 14px;
            }
            .flowchart-box {
                min-height: 120px;
            }
            .code-area {
                min-height: 220px;
                padding: 12px 8px;
                font-size: 14px;
                line-height: 2;
            }
            .code-input {
                min-width: 60px;
                max-width: 120px;
                font-size: 14px;
            }
            .code-input:focus {
                min-width: 80px;
            }
            .line-num {
                width: 20px;
                margin-right: 8px;
                font-size: 12px;
            }
            .action-bar {
                flex-wrap: wrap;
                gap: 6px;
            }
            .btn {
                padding: 6px 12px;
                font-size: 13px;
                flex: 1 1 auto;
                min-width: 50px;
            }
            .btn-submit {
                flex: 2 1 auto;
            }
            .correct-answer-list {
                margin-left: 12px;
            }
        }

        @media screen and (max-width: 480px) {
            .header h1 { font-size: 18px; letter-spacing: 1px; }
            .btn-back { font-size: 11px; padding: 4px 12px; }
            .grid-nav {
                grid-template-columns: repeat(4, 1fr);
                gap: 6px;
            }
            .grid-nav button {
                padding: 8px 0;
                font-size: 13px;
                border-radius: 6px;
            }
            .code-area {
                font-size: 13px;
                line-height: 1.8;
                min-height: 180px;
                padding: 10px 6px;
            }
            .code-input {
                font-size: 13px;
                min-width: 50px;
                max-width: 100px;
            }
            .code-input:focus {
                min-width: 70px;
            }
            .line-num {
                width: 16px;
                margin-right: 6px;
                font-size: 11px;
            }
            .panel {
                padding: 10px;
            }
            .problem-title {
                font-size: 17px;
            }
            .problem-desc {
                font-size: 13px;
                padding: 10px 12px;
            }
            .btn {
                font-size: 12px;
                padding: 5px 10px;
                min-width: 40px;
            }
            .sidebar-right {
                padding: 10px;
            }
            .correct-answer-box, .explanation-box {
                padding: 10px 12px;
            }
            .flow-container {
                transform: scale(0.45);
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-top">
            <h1>信息技术程序题闯关练习</h1>
            <a href="programming-questions.html" class="btn-back">返回上页</a>
        </div>
        <p>通过完成16道编程填空题，提升Python编程能力和逻辑思维。每道题都有详细的解析，帮助你理解编程概念。</p>
    </div>

    <div class="main-container">
        <div class="panel sidebar-left">
            <div class="panel-title">题目列表</div>
            <div class="grid-nav" id="questionNav"></div>
            <div class="panel-title" style="margin-top: 16px;">程序流程图</div>
            <div class="flowchart-box" id="flowchartBox">
                <!-- 由JS动态生成 -->
            </div>
        </div>

        <div class="panel content-center">
            <div class="problem-title" id="problemTitle">题目 1：海伦公式计算三角形面积</div>
            <div class="problem-desc" id="problemDesc">在希腊数学家海伦的著作《测量仪》中，记载了著名的海伦公式，利用三角形的三边长求三角形面积。补全以下程序。</div>
            
            <div class="code-area" id="codeArea">
                <!-- 由JS动态生成 -->
            </div>

            <div class="action-bar">
                <button class="btn btn-prev" onclick="prevQuestion()">上一题</button>
                <button class="btn btn-submit" onclick="checkAnswer()">提交答案</button>
                <button class="btn btn-next" onclick="nextQuestion()">下一题</button>
            </div>
        </div>

        <div class="panel sidebar-right">
            <div class="panel-title">答案与解析</div>
            <div class="result-status" id="resultStatus">请完成题目后查看答案和解析</div>
            
            <div class="correct-answer-box">
                <h4>正确答案：</h4>
                <ul class="correct-answer-list" id="correctAnswers">
                    <li>等待提交...</li>
                </ul>
            </div>
            
            <div class="explanation-box" id="explanationBox">
                <strong>知识点解析：</strong><br>
                完成题目后显示详细解析。
            </div>
        </div>
    </div>

    <script>
        // 完整题库数据 (16题全收录)
        const questions = [
            { // 题1
                id: 1,
                title: "题目 1：海伦公式计算三角形面积",
                desc: "在希腊数学家海伦的著作《测地术》中，记载了著名的海伦公式，利用三角形的三边长求三角形面积，若三角形的三边长分别为a、b、c，则：p = (a+b+c)/2，面积= √[p(p-a)(p-b)(p-c)]。",
                codeLines: [
                    { text: "a = float({1}(\"请输入第一条边长：\"))", blanks: [{id: 1, pre: "a = float(", post: "(\"请输入第一条边长：\"))"}] },
                    { text: "b = float(input(\"请输入第二条边长：\"))", blanks: [] },
                    { text: "c = float(input(\"请输入第三条边长：\"))", blanks: [] },
                    { text: "{2} a+b>c and b+c>a and c+a>b:", blanks: [{id: 2, pre: "", post: " a+b>c and b+c>a and c+a>b:"}] },
                    { text: "    p = (a+b+c)/2", blanks: [] },
                    { text: "    {3} = (p*(p-a)*(p-b)*(p-c))**0.5", blanks: [{id: 3, pre: "    ", post: " = (p*(p-a)*(p-b)*(p-c))**0.5"}] },
                    { text: "    print(\"三角形面积为：\", round(s,2))", blanks: [] },
                    { text: "else:", blanks: [] },
                    { text: "    print(\"不构成三角形，请重新输入\")", blanks: [] }
                ],
                answers: { 1: "input", 2: "if", 3: "s" },
                flowchart: `<div class="flow-container"><div class="flow-box">开始</div><div class="arrow-down"></div><div class="flow-box">输入三边长</div><div class="arrow-down"></div><div class="flow-diamond"><span>判断三角形</span></div><div class="arrow-down"></div><div class="flow-box">计算面积</div><div class="arrow-down"></div><div class="flow-box">输出面积</div></div>`,
                explanation: "本题考察 `input()` 获取输入并转为 `float` 浮点数；使用 `if` 条件判断三角形三边关系；通过公式计算面积并赋值给变量 `s`。"
            },
            { // 题2
                id: 2,
                title: "题目 2：计算阶乘",
                desc: "正整数的阶乘是所有小于及等于该数的正整数的积。即：n!=1*2*3*4*...*n，举例说明：3的阶乘就是1*2*3，要求编写程序，计算正整数n的阶乘。",
                codeLines: [
                    { text: "{1} = int(input(\"请输入一个正整数：\"))", blanks: [{id: 1, pre: "", post: " = int(input(\"请输入一个正整数：\"))"}] },
                    { text: "pd = 1", blanks: [] },
                    { text: "for i in range(1, n+1):", blanks: [] },
                    { text: "    pd = {2} * i", blanks: [{id: 2, pre: "    pd = ", post: " * i"}] },
                    { text: "{3}(\"pd =\", pd)", blanks: [{id: 3, pre: "", post: "(\"pd =\", pd)"}] }
                ],
                answers: { 1: "n", 2: "pd", 3: "print" },
                flowchart: `<div class="flow-container"><div class="flow-box">开始</div><div class="arrow-down"></div><div class="flow-box">输入n</div><div class="arrow-down"></div><div class="flow-box">pd=1, i=1</div><div class="arrow-down"></div><div class="flow-diamond"><span>i<=n</span></div><div class="arrow-down"></div><div class="flow-box">pd=pd*i, i++</div><div class="arrow-down"></div><div class="flow-box">输出pd</div></div>`,
                explanation: "本题考察 `for` 循环累乘。初始化乘积变量 `pd` 为1，循环遍历 1 到 n，每次将 `pd` 乘上循环变量 `i`，最后 `print` 输出结果。"
            },
            { // 题3
                id: 3,
                title: "题目 3：枚举法解决乘号问题",
                desc: "有一张由5位数构成的车牌号，其千位和百位上的数字模糊看不清了，已知这个数能被57或67整除。万位数字 a 和十位、个位数字 d,e 由用户输入，空缺位为 b,c。请用枚举法补全程序。",
                codeLines: [

                    { text: "i = int(input(\"请输入金额：\"))", blanks: [] },
                    { text: "{1} i >= 200:", blanks: [{id: 1, pre: "", post: " i >= 200:"}] },
                    { text: "    i = {2} -20", blanks: [{id: 2, pre: "    i = ", post: " -20"}] },
                    { text: "    print(\"你实际支付\", i)", blanks: [] },
                    { text: "else:", blanks: [] },
                    { text: "    {3}(\"对不起，你不能享受优惠\")", blanks: [{id: 3, pre: "    ", post: "(\"对不起，你不能享受优惠\")"}] }
                ],
                answers: { 1: "if", 2: "i - 20", 3: "print" },
                flowchart: `<div class="flow-container"><div class="flow-box">开始</div><div class="arrow-down"></div><div class="flow-box">输入金额i</div><div class="arrow-down"></div><div class="flow-diamond"><span>i>=200</span></div><div class="arrow-down"></div><div class="flow-box">计算i-20</div><div class="arrow-down"></div><div class="flow-box">输出实际支付</div></div>`,
                explanation: "本题考察基础的 `if-else` 条件判断。当金额大于等于200时，实际支付为当前金额减去优惠券金额 `i - 20`；否则，无法享受优惠。"
            },
            { // 题16
                id: 16,
                title: "题目 16：成绩分级",
                desc: "利用计算机编程对学生的成绩进行分级，其划分标准为：小于60分为努力加油；60-70分为及格；70-80分为良好；80-90分为优秀，90-100分为非常棒。输入你的成绩，最终输出分级信息。",
                codeLines: [
                    { text: "{1} = int(input(\"请输入你的成绩：\"))", blanks: [{id: 1, pre: "", post: " = int(input(\"请输入你的成绩：\"))"}] },
                    { text: "if score >= 90 and score <= 100:", blanks: [] },
                    { text: "    {2}(\"非常棒！\")", blanks: [{id: 2, pre: "    ", post: "(\"非常棒！\")"}] },
                    { text: "elif score >= 80 and score < 90:", blanks: [] },
                    { text: "    print(\"优秀！\")", blanks: [] },
                    { text: "elif score >= 70 and score < 80:", blanks: [] },
                    { text: "    print(\"良好！\")", blanks: [] },
                    { text: "{3} score >= 60 and score < 70:", blanks: [{id: 3, pre: "", post: " score >= 60 and score < 70:"}] },
                    { text: "    print(\"及格！\")", blanks: [] },
                    { text: "else:", blanks: [] },
                    { text: "    print(\"要努力加油！\")", blanks: [] }
                ],
                answers: { 1: "score", 2: "print", 3: "elif" },
                flowchart: `<div class="flow-container"><div class="flow-box">开始</div><div class="arrow-down"></div><div class="flow-box">输入成绩score</div><div class="arrow-down"></div><div class="flow-diamond"><span>判断成绩等级</span></div><div class="arrow-down"></div><div class="flow-box">输出分级信息</div><div class="arrow-down"></div><div class="flow-box">结束</div></div>`,
                explanation: "本题考察 `if-elif-else` 阶梯式条件判断。根据 `score` 的值在多个不同的区间执行不同的打印语句，特别要注意 `elif` 的用法以及区间的准确划分。"
            }
        ];

        let currentIndex = 0;

        // 渲染左侧 16 格题目导航
        function renderNav() {
            const nav = document.getElementById('questionNav');
            nav.innerHTML = '';
            for (let i = 1; i <= 16; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.onclick = () => switchQuestion(i - 1);
                if (i - 1 === currentIndex) btn.classList.add('active');
                nav.appendChild(btn);
            }
        }

        // 切换题目
        function switchQuestion(index) {
            currentIndex = index;
            renderNav();
            renderQuestion();
            document.getElementById('resultStatus').textContent = "请完成题目后查看答案和解析";
            document.getElementById('correctAnswers').innerHTML = "<li>等待提交...</li>";
            document.getElementById('explanationBox').innerHTML = "<strong>知识点解析：</strong><br>完成题目后显示详细解析。";
        }

        // 渲染中央区域的具体题目和代码
        function renderQuestion() {
            const q = questions[currentIndex];
            document.getElementById('problemTitle').textContent = q.title;
            document.getElementById('problemDesc').textContent = q.desc;
            document.getElementById('flowchartBox').innerHTML = q.flowchart || "暂无流程图";

            const codeArea = document.getElementById('codeArea');
            codeArea.innerHTML = '';

            q.codeLines.forEach((line, index) => {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'code-line';
                
                const numSpan = document.createElement('span');
                numSpan.className = 'line-num';
                numSpan.textContent = index + 1;
                lineDiv.appendChild(numSpan);

                let htmlContent = line.text;
                
                if (line.blanks.length > 0) {
                    line.blanks.sort((a,b) => a.id - b.id).forEach(blank => {
                        const exactPlaceholder = blank.pre + '{' + blank.id + '}' + blank.post;
                        const replacement = blank.pre + `<input type="text" class="code-input" data-id="${blank.id}" data-answer="${q.answers[blank.id] || ''}" style="width: 120px;">` + blank.post;
                        htmlContent = htmlContent.replace(exactPlaceholder, replacement);
                    });
                }
                
                lineDiv.innerHTML += `<span style="color: #d4d4d4;">${htmlContent}</span>`;
                codeArea.appendChild(lineDiv);
            });
        }

        // 提交答案并评测
        function checkAnswer() {
            const q = questions[currentIndex];
            const inputs = document.querySelectorAll('.code-input');
            let correctCount = 0;
            let totalBlanks = inputs.length;
            if(totalBlanks === 0) { 
                document.getElementById('resultStatus').textContent = "无填空项，请检查题目设置。"; 
                return; 
            }

            inputs.forEach(inp => {
                const userVal = inp.value.trim();
                const correctVal = inp.dataset.answer;
                if (userVal === correctVal) {
                    inp.classList.add('correct');
                    inp.classList.remove('wrong');
                    correctCount++;
                } else {
                    inp.classList.add('wrong');
                    inp.classList.remove('correct');
                }
            });

            document.getElementById('resultStatus').textContent = `答对了 ${correctCount}/${totalBlanks} 个空`;
            
            const correctList = document.getElementById('correctAnswers');
            correctList.innerHTML = '';
            let idx = 1;
            for (const [key, val] of Object.entries(q.answers)) {
                const li = document.createElement('li');
                li.innerHTML = `<strong>[${idx}]</strong> <span style="color:#4caf50;">${val}</span>`;
                correctList.appendChild(li);
                idx++;
            }

            document.getElementById('explanationBox').innerHTML = `<strong>知识点解析：</strong><br>${q.explanation}`;
        }

        function prevQuestion() {
            if (currentIndex > 0) switchQuestion(currentIndex - 1);
            else alert("已经是第一题了！");
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) switchQuestion(currentIndex + 1);
            else alert("已完成所有题目闯关！");
        }

        // 初始化运行
        renderNav();
        renderQuestion();
    </script>
</body>
</html>
