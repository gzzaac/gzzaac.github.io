<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>高中信息技术 - Python 程序题闯关练习</title>
    <style>
        :root {
            --bg-main: #f5eee0;
            --bg-panel: #faf6ec;
            --bg-code: #efe5d1;
            --text-main: #2a1e13;
            --text-accent: #a7581a;
            --border-color: #6b5a42;
            --highlight: #eadfc6;
            --glow-shadow: 0 0 20px rgba(167, 88, 26, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(rgba(245, 238, 224, 0.68), rgba(245, 238, 224, 0.76)), url('./images/paper-texture.jpg') center/cover fixed;



            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
            flex-shrink: 0;
            width: 100%;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 10px;
            flex-wrap: wrap;
        }
        .header h1 {
            font-size: clamp(20px, 5vw, 28px);
            color: #ffffff;
            letter-spacing: 2px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(167, 88, 26, 0.4);
            flex: 1;
            text-align: center;
            margin: 0;
        }
        .header p {
            font-size: clamp(12px, 2.5vw, 14px);
            color: #6b5a42;
            margin-top: 8px;
            letter-spacing: 0.5px;
            padding: 0 10px;
        }

        .btn-back {
            background: linear-gradient(135deg, #a7581a 0%, #7c4312 100%);
            color: #ffffff;
            border: 1px solid #c9a86a;
            padding: 6px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: clamp(12px, 2vw, 14px);
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(167, 88, 26, 0.1);
            white-space: nowrap;
        }
        .btn-back:hover {
            background: linear-gradient(135deg, #7c4312 0%, #4a2a0e 100%);
            box-shadow: 0 0 20px rgba(167, 88, 26, 0.3);
            transform: scale(1.02);
        }

        .main-container {
            display: flex;
            flex: 1;
            gap: 16px;
            height: auto;
            min-height: calc(100vh - 140px);
            flex-wrap: wrap;
        }

        .panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            flex: 1 1 0;
            min-width: 200px;
        }
        .panel::before {
            content: '';
            position: absolute;
            top: -1px; left: 20%; right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--text-accent), transparent);
            opacity: 0.6;
        }
        
        .panel-title {
            font-size: clamp(15px, 2.6vw, 17px);
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 14px;
            color: #2a1e13;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }
        .panel-title::before {
            content: '';
            display: inline-block;
            width: 4px; height: 16px;
            background-color: var(--text-accent);
            border-radius: 2px;
            margin-right: 10px;
        }

        /* 左侧面板 - 导航网格 */
        .sidebar-left {
            flex: 0 0 220px;
            min-width: 160px;
        }
        .grid-nav {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .grid-nav button {
            background-color: #f2ead9;
            border: 1px solid #7c4312;
            color: #2a1e13;
            padding: 12px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: clamp(14px, 2.2vw, 16px);
            font-weight: 600;
        }
        .grid-nav button:hover {
            background-color: var(--highlight);
            border-color: var(--text-accent);
            color: #2a1e13;
            box-shadow: 0 0 12px rgba(167, 88, 26, 0.15);
        }
        .grid-nav button.active {
            background-color: var(--text-accent);
            color: #ffffff;
            border-color: var(--text-accent);
            font-weight: bold;
            box-shadow: 0 0 20px rgba(167, 88, 26, 0.3);
        }

        .flowchart-box {
            margin-top: 16px;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5eee0;
            border-radius: 8px;
            min-height: 160px;
            padding: 8px;
            position: relative;
            font-size: 13px;
            text-align: center;
            border: 1px solid #ddd0b4;
            overflow: hidden;
        }
        .flow-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transform: scale(0.85);
            transform-origin: center center;
        }
        @media (max-width: 600px) {
            .flow-container { transform: scale(0.7); }
        }
        .flow-box {
            border: 2px solid #7c4312;
            padding: 6px 14px;
            border-radius: 6px;
            background: #ffffff;
            font-size: 15px;
            color: #1a1208;
            font-weight: 600;
        }
        .flow-diamond {
            border: 2px solid #7c4312;
            padding: 2px;
            transform: rotate(45deg);
            width: 70px; height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            margin: 4px 0;
        }
        .flow-diamond span { transform: rotate(-45deg); font-size: 13px; color: #1a1208; line-height: 1.2; font-weight: 600; }
        .arrow-down { width: 2px; height: 14px; background: #7c4312; }

        /* 中间内容 */
        .content-center {
            flex: 1 1 0;
            min-width: 280px;
        }
        .problem-title {
            font-size: clamp(18px, 3.5vw, 22px);
            margin-bottom: 10px;
            color: #2a1e13;
            font-weight: bold;
            word-break: break-word;
        }
        .problem-desc {
            background: rgba(167, 88, 26, 0.04);
            border: 1px solid rgba(167, 88, 26, 0.2);
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 16px;
            font-size: clamp(13px, 2vw, 15px);
            line-height: 1.7;
            color: #6b5a42;
        }
        .code-area {
            background-color: #3a2a1d;
            border-radius: 8px;
            padding: 16px 12px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: clamp(15px, 2.4vw, 17px);
            line-height: 2.2;
            position: relative;
            border: 1px solid var(--border-color);
            flex: 1;
            overflow-y: auto;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
            min-height: 300px;
            color: #f5eee0;
        }
        .code-line {
            display: flex;
            align-items: baseline;
            white-space: pre-wrap;
            word-break: break-word;
            padding: 2px 0;
        }
        .line-num {
            color: #c9a86a;
            width: 26px;
            text-align: right;
            margin-right: 12px;
            user-select: none;
            font-size: clamp(12px, 1.8vw, 14px);
            flex-shrink: 0;
        }
        .code-input {
            background: transparent;
            border: none;
            border-bottom: 2px dashed #c9a86a;
            color: #f5eee0;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: clamp(14px, 2.2vw, 16px);
            min-width: 80px;
            max-width: 160px;
            width: auto;
            padding: 0 4px;
            outline: none;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
            margin: 0 2px;
        }
        .code-input:focus {
            border-bottom: 2px solid #ffffff;
            box-shadow: 0 8px 12px -8px rgba(167, 88, 26, 0.3);
            min-width: 100px;
            color: #ffffff;
        }
        .code-input.correct {
            border-bottom-color: #4caf50;
            color: #4caf50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
        }
        .code-input.wrong {
            border-bottom-color: #f44336;
            color: #f44336;
            box-shadow: 0 0 10px rgba(244, 67, 54, 0.3);
        }

        .action-bar {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: clamp(13px, 2vw, 15px);
            transition: all 0.2s;
            font-weight: bold;
            flex: 1 1 auto;
            min-width: 60px;
            text-align: center;
        }
        .btn-prev, .btn-next {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: #6b5a42;
        }
        .btn-prev:hover, .btn-next:hover {
            background-color: var(--highlight);
            border-color: var(--text-accent);
            color: #fff;
        }
        .btn-submit {
            background-color: var(--text-accent);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(167, 88, 26, 0.2);
            border: 1px solid transparent;
            flex: 2 1 auto;
        }
        .btn-submit:hover {
            background-color: #b97a3e;
            box-shadow: 0 0 30px rgba(167, 88, 26, 0.4);
            transform: scale(1.02);
        }

        /* 右侧面板 */
        .sidebar-right {
            flex: 0 0 300px;
            min-width: 220px;
        }
        .result-status {
            color: #2a1e13;
            margin-bottom: 14px;
            font-size: clamp(14px, 2.2vw, 15px);
            padding: 10px 12px;
            background: #faf6ec;
            border-radius: 6px;
            border: 1px solid #ddd0b4;
            font-weight: 500;
        }
        .correct-answer-box {
            background-color: #f6f0e3;
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 14px;
            border: 1px solid var(--border-color);
        }
        .correct-answer-box h4 {
            margin-bottom: 10px;
            color: var(--text-accent);
            font-size: clamp(13px, 2vw, 14px);
            letter-spacing: 0.5px;
        }
        .correct-answer-list {
            margin-left: 16px;
            list-style-type: decimal;
            color: #4caf50;
            font-family: 'Consolas', monospace;
            font-size: clamp(13px, 2vw, 14px);
        }
        .correct-answer-list li {
            margin-bottom: 4px;
        }
        .explanation-box {
            background-color: #f6f0e3;
            padding: 14px 16px;
            border-radius: 8px;
            color: #2a1e13;
            font-size: clamp(13px, 2vw, 14px);
            line-height: 1.7;
            border: 1px solid var(--border-color);
        }
        .explanation-box strong {
            color: #7c4312;
            font-size: 1.05em;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #c9a86a; }

        /* 响应式适配 */
        @media screen and (max-width: 1024px) {
            .sidebar-left { flex: 1 1 180px; min-width: 140px; }
            .sidebar-right { flex: 1 1 260px; min-width: 180px; }
            .main-container { gap: 12px; }
        }

        @media screen and (max-width: 768px) {
            body { padding: 8px; }
            .header { margin-bottom: 12px; }
            .header-top { justify-content: center; }
            .header h1 { font-size: clamp(18px, 4.5vw, 24px); }
            .btn-back { padding: 5px 14px; font-size: 12px; }
            .main-container {
                flex-direction: column;
                gap: 12px;
                min-height: auto;
            }
            .panel {
                padding: 14px;
                flex: 1 1 auto;
                min-height: auto;
            }
            .sidebar-left {
                flex: 1 1 auto;
                min-width: 0;
                order: 1;
            }
            .content-center {
                flex: 1 1 auto;
                min-width: 0;
                order: 2;
            }
            .sidebar-right {
                flex: 1 1 auto;
                min-width: 0;
                order: 3;
            }
            .grid-nav {
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
            }
            .grid-nav button {
                padding: 10px 0;
                font-size: 14px;
            }
            .flowchart-box {
                min-height: 120px;
            }
            .code-area {
                min-height: 220px;
                padding: 12px 8px;
                font-size: 14px;
                line-height: 2;
            }
            .code-input {
                min-width: 60px;
                max-width: 120px;
                font-size: 14px;
            }
            .code-input:focus {
                min-width: 80px;
            }
            .line-num {
                width: 20px;
                margin-right: 8px;
                font-size: 12px;
            }
            .action-bar {
                flex-wrap: wrap;
                gap: 6px;
            }
            .btn {
                padding: 6px 12px;
                font-size: 13px;
                flex: 1 1 auto;
                min-width: 50px;
            }
            .btn-submit {
                flex: 2 1 auto;
            }
            .correct-answer-list {
                margin-left: 12px;
            }
        }

        @media screen and (max-width: 480px) {
            .header h1 { font-size: 18px; letter-spacing: 1px; }
            .btn-back { font-size: 11px; padding: 4px 12px; }
            .grid-nav {
                grid-template-columns: repeat(4, 1fr);
                gap: 6px;
            }
            .grid-nav button {
                padding: 8px 0;
                font-size: 13px;
                border-radius: 6px;
            }
            .code-area {
                font-size: 13px;
                line-height: 1.8;
                min-height: 180px;
                padding: 10px 6px;
            }
            .code-input {
                font-size: 13px;
                min-width: 50px;
                max-width: 100px;
            }
            .code-input:focus {
                min-width: 70px;
            }
            .line-num {
                width: 16px;
                margin-right: 6px;
                font-size: 11px;
            }
            .panel {
                padding: 10px;
            }
            .problem-title {
                font-size: 17px;
            }
            .problem-desc {
                font-size: 13px;
                padding: 10px 12px;
            }
            .btn {
                font-size: 12px;
                padding: 5px 10px;
                min-width: 40px;
            }
            .sidebar-right {
                padding: 10px;
            }
            .correct-answer-box, .explanation-box {
                padding: 10px 12px;
            }
            .flow-container {
                transform: scale(0.45);
            }
        }
    </style>
</head>
