<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正安二中信息技术测试平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.85)), 
                        url('./images/background.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        /* 备用背景样式 - 如果图片加载失败时使用 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: -2;
            opacity: 0;
        }
        
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            backdrop-filter: blur(5px);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #2196F3;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 20px;
        }
        
        .notification-bar {
            background: rgba(255, 193, 7, 0.85);
            color: #333;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            font-weight: bold;
            text-align: center;
            width: 100%;
        }
        
        .nav-cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 15px;
            padding: 30px;
            width: 300px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
            background: rgba(255, 255, 255, 0.75);
        }
        
        .card h2 {
            color: #2196F3;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }
        
        .card p {
            color: #555;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .btn {
            display: inline-block;
            background: #0288d1;
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }
        
        .card-1 .btn {
            background: linear-gradient(45deg, #2196F3, #03A9F4);
        }
        
        .card-2 .btn {
            background: linear-gradient(45deg, #2196F3, #03A9F4);
        }
        
        .card-3 .btn {
            background: linear-gradient(45deg, #2196F3, #03A9F4);
        }
        
        @media (max-width: 768px) {
            .nav-cards {
                flex-direction: column;
                align-items: center;
            }
            
            .card {
                width: 90%;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>正安县第二中学信息技术平台</h1>
            <p class="subtitle">信息技术学业水平测试大闯关</p>
        </header>
        
        <div class="notification-bar">
            📢 重要通知：信息技术学业水平考试将于11月12日举行，为期三天。题库增加110道题，新增情景应用题型，请同学们认真复习，做好准备！
        </div>
        
        <div class="nav-cards">
            <div class="card card-1">
                <h2>选择题</h2>
                <p>涵盖信息技术基础知识，帮助您巩固所学内容。</p>
                <a href="multiple-choice.html" class="btn">开始测试</a>
            </div>
            
            <div class="card card-2">
                <h2>情景应用题</h2>
                <p>测试您在实际场景中应用信息技术的能力。</p>
                <a href="scenario-questions.html" class="btn">开始测试</a>
            </div>
            
            <div class="card card-3">
                <h2>复习大纲</h2>
                <p>查看信息技术复习大纲，了解考试重点和知识点分布。</p>
                <a href="zaezfx.html" class="btn">查看大纲</a>
            </div>
        </div>
    </div>

    <script>
        // 图片加载失败时的备用方案
        document.addEventListener('DOMContentLoaded', function() {
            const bgImage = new Image();
            bgImage.onerror = function() {
                console.log('背景图片加载失败，使用备用背景');
                document.body.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
            };
            bgImage.src = './images/background.jpg';
        });
    </script>
</body>

</html>
