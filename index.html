<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正安二中信息技术测试平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.85)), 
                        url('./images/background.jpg');
            background-size: cover;
            background-position: center;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            transition: background 0.5s ease;
        }
        
        .container {
            width: 90%;
            max-width: 1400px;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            backdrop-filter: blur(5px);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #2196F3;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 20px;
        }
        
        .notification-bar {
            background: rgba(255, 193, 7, 0.85);
            color: #333;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            font-weight: bold;
            text-align: left;
            width: 100%;
            line-height: 1.5;
        }
        
        .nav-cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 20px;
            margin-top: 20px;
            flex: 1;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 15px;
            padding: 25px;
            flex: 1;
            min-width: 240px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
            background: rgba(255, 255, 255, 0.75);
        }
        
        .card h2 {
            color: #2196F3;
            margin-bottom: 15px;
            font-size: 1.7rem;
        }
        
        .card p {
            color: #555;
            margin-bottom: 20px;
            line-height: 1.6;
            font-size: 0.95rem;
        }
        
        .btn {
            display: inline-block;
            background: #0288d1;
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            font-size: 0.95rem;
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }
        
        .card-1 .btn {
            background: linear-gradient(45deg, #2196F3, #03A9F4);
        }
        
        .card-2 .btn {
            background: linear-gradient(45deg, #2196F3, #03A9F4);
        }
        
        .card-3 .btn {
            background: linear-gradient(45deg, #2196F3, #03A9F4);
        }
        
        .card-4 .btn {
            background: linear-gradient(45deg, #2196F3, #03A9F4);
        }
        
        /* ===== 底部统计样式（优化移动端） ===== */
        .footer-stats {
            width: 100%;
            text-align: center;
            padding: 20px 15px;
            margin-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(6px);
            border-radius: 12px;
            color: #555;
            font-size: 1rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px 20px;
            transition: all 0.3s;
        }
        
        .footer-stats .stat-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        
        .footer-stats .stat-label {
            font-weight: 500;
            color: #555;
        }
        
        .footer-stats .stat-number {
            font-weight: 700;
            color: #2196F3;
            font-size: 1.1rem;
            min-width: 30px;
            display: inline-block;
            transition: all 0.5s ease;
        }
        
        .footer-stats .divider {
            color: #ccc;
            font-weight: 300;
            user-select: none;
        }
        
        /* 移动端优化：小屏幕时改为上下排列，更清晰 */
        @media (max-width: 600px) {
            .footer-stats {
                flex-direction: column;
                gap: 8px;
                padding: 18px 12px;
                font-size: 1.05rem;
                border-radius: 10px;
            }
            
            .footer-stats .divider {
                display: none;  /* 隐藏竖线分隔符，用上下间距代替 */
            }
            
            .footer-stats .stat-number {
                font-size: 1.2rem;
                min-width: 40px;
            }
            
            .footer-stats .stat-item {
                width: 100%;
                justify-content: center;
            }
        }
        
        /* 极小屏（≤ 400px）进一步微调 */
        @media (max-width: 400px) {
            .footer-stats {
                font-size: 0.95rem;
                padding: 14px 8px;
            }
            .footer-stats .stat-number {
                font-size: 1.1rem;
            }
        }
        
        /* 响应式设计（原有） */
        @media (max-width: 1200px) {
            .card {
                flex: 0 0 calc(50% - 20px);
            }
        }
        
        @media (max-width: 768px) {
            .nav-cards {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }
            
            .card {
                width: 90%;
                max-width: 400px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                width: 95%;
            }
            
            .card {
                width: 100%;
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>正安县第二中学信息技术平台</h1>
            <p class="subtitle">信息技术学业水平测试大闯关</p>
        </header>
        
        <div class="notification-bar">
            📢 Python程序设计题中新增16道提升填空题。本站题库持续开放更新，助力大家深化理解、夯实基础。学无止境，气有浩然！
        </div>
        
        <div class="nav-cards">
            <div class="card card-1">
                <h2>选择题</h2>
                <p>涵盖信息技术基础知识，帮助您巩固所学内容。</p>
                <a href="multiple-choice.html" class="btn">开始测试</a>
            </div>
            
            <div class="card card-2">
                <h2>情景应用题</h2>
                <p>测试您在实际场景中应用信息技术的能力。</p>
                <a href="scenario-questions.html" class="btn">开始测试</a>
            </div>
            
            <div class="card card-3">
                <h2>程序设计题</h2>
                <p>测试Python编程基础，提升算法思维和代码实现能力。</p>
                <a href="programming-questions.html" class="btn">开始测试</a>
            </div>
            
            <div class="card card-4">
                <h2>复习大纲</h2>
                <p>查看信息技术复习大纲，了解考试重点和知识点分布。</p>
                <a href="zaezfx.html" class="btn">查看大纲</a>
            </div>
        </div>

        <!-- 底部访问量统计（使用不蒜子） -->
        <div class="footer-stats">
            <span class="stat-item">
                <span class="stat-label">📊 总访问量：</span>
                <span class="stat-number" id="busuanzi_value_site_pv">0</span>
                <span>次</span>
            </span>
            <span class="divider">|</span>
            <span class="stat-item">
                <span class="stat-label">👥 访客数：</span>
                <span class="stat-number" id="busuanzi_value_site_uv">0</span>
                <span>人</span>
            </span>
        </div>
    </div>

    <!-- 不蒜子统计脚本（异步加载） -->
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

    <script>
        // 背景图片加载失败时的备用方案
        document.addEventListener('DOMContentLoaded', function() {
            const bgImage = new Image();
            bgImage.onerror = function() {
                console.log('背景图片加载失败，使用备用背景');
                document.body.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
            };
            bgImage.src = './images/background.jpg';
        });

        // 可选：当不蒜子数据加载完成后，给数字增加淡入效果
        document.addEventListener('DOMContentLoaded', function() {
            const observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    if (mutation.type === 'characterData' || mutation.type === 'childList') {
                        const pv = document.getElementById('busuanzi_value_site_pv');
                        const uv = document.getElementById('busuanzi_value_site_uv');
                        if (pv && pv.textContent && pv.textContent !== '0') {
                            pv.style.opacity = '1';
                        }
                        if (uv && uv.textContent && uv.textContent !== '0') {
                            uv.style.opacity = '1';
                        }
                    }
                });
            });
            const pv = document.getElementById('busuanzi_value_site_pv');
            const uv = document.getElementById('busuanzi_value_site_uv');
            if (pv) observer.observe(pv, { characterData: true, childList: true, subtree: true });
            if (uv) observer.observe(uv, { characterData: true, childList: true, subtree: true });
            // 初始透明度为0，加载后自动变为1（由不蒜子更新）
            if (pv) pv.style.opacity = '0';
            if (uv) uv.style.opacity = '0';
            // 添加过渡
            const style = document.createElement('style');
            style.textContent = '.stat-number { transition: opacity 0.6s ease; }';
            document.head.appendChild(style);
        });
    </script>
</body>
</html>
