/* 触摸设备优化 */
@media (hover: none) and (pointer: coarse) {
    .question-count-selector button:hover,
    .navigation button:hover:not(:disabled),
    .quick-nav button:hover:not(:disabled),
    .return-home button:hover {
        transform: none;
    }
    
    .question-count-selector button:active,
    .navigation button:active:not(:disabled),
    .quick-nav button:active:not(:disabled),

        // 全局变量
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let userAnswers = [];
        let testStartTime = null;
        let timerInterval = null;
        let totalQuestions = 0;
        let testInProgress = false;

        // DOM元素
        const questionTitle = document.getElementById('question-title');
        const optionsContainer = document.getElementById('options');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');
        const progress = document.getElementById('progress');
        const startTime = document.getElementById('start-time');
        const elapsedTime = document.getElementById('elapsed-time');
        const quickNav = document.getElementById('quick-nav');
        const resultContainer = document.getElementById('result-container');
        const statistics = document.getElementById('statistics');
        const wrongQuestions = document.getElementById('wrong-questions');
        const returnHomeBtn = document.getElementById('return-home-btn');
        const btn10 = document.getElementById('btn-10');
        const btn20 = document.getElementById('btn-20');
        const btn30 = document.getElementById('btn-30');

        // 初始化
        function init() {
            // 从本地存储加载进度
            loadProgress();
            
            // 如果测试正在进行中，恢复测试
            if (testInProgress) {
                showQuestion(currentQuestionIndex);
                updateProgress();
                updateQuickNav();
                startTimer();
            } else {
                // 否则显示题目数量选择
                questionTitle.textContent = "请选择题目数量开始测试";
                optionsContainer.innerHTML = "";
                progress.textContent = "进度: 0/0";
                startTime.textContent = "--:--:--";
                elapsedTime.textContent = "00:00:00";
                quickNav.innerHTML = "";
            }
            
            // 添加事件监听器
            prevBtn.addEventListener('click', goToPrevQuestion);
            nextBtn.addEventListener('click', goToNextQuestion);
            submitBtn.addEventListener('click', submitTest);
            returnHomeBtn.addEventListener('click', returnToHome);
            btn10.addEventListener('click', () => startTest(10));
            btn20.addEventListener('click', () => startTest(20));
            btn30.addEventListener('click', () => startTest(30));
        }

        // 开始测试
        function startTest(count) {
            // 重置状态
            currentQuestions = getRandomQuestions(count);
            currentQuestionIndex = 0;
            userAnswers = new Array(count).fill(null);
            testStartTime = new Date();
            totalQuestions = count;
            testInProgress = true;
            
            // 保存进度到本地存储
            saveProgress();
            
            // 显示第一题
            showQuestion(0);
            updateProgress();
            updateQuickNav();
            startTimer();
        }

        // 获取随机题目 - 修改确保每次都是随机顺序
        function getRandomQuestions(count) {
            // 如果请求的题目数量超过可用题目数量，返回所有题目
            if (count >= questions.length) {
                return [...questions].sort(() => Math.random() - 0.5);
            }
            
            // 随机选择题目
            const shuffled = [...questions].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, count);
        }

        // 显示题目
        function showQuestion(index) {
            if (index < 0 || index >= currentQuestions.length) return;
            
            const question = currentQuestions[index];
            questionTitle.textContent = `${index + 1}. ${question.question}`;
            
            // 清空选项
            optionsContainer.innerHTML = "";
            
            // 添加选项
            question.options.forEach((option, i) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                
                const input = document.createElement('input');
                input.type = 'radio';
                input.name = 'answer';
                input.value = String.fromCharCode(65 + i); // A, B, C, D
                input.id = `option-${i}`;
                
                // 如果用户已经选择了这个选项，设置为选中
                if (userAnswers[index] === input.value) {
                    input.checked = true;
                }
                
                input.addEventListener('change', () => {
                    userAnswers[index] = input.value;
                    updateQuickNav();
					updateProgress();  // 添加这一行
                    saveProgress();
                });
                
                const label = document.createElement('label');
                label.htmlFor = `option-${i}`;
                label.textContent = option;
                
                optionDiv.appendChild(input);
                optionDiv.appendChild(label);
                optionsContainer.appendChild(optionDiv);
            });
            
            // 更新导航按钮状态
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === currentQuestions.length - 1;
            
            // 更新当前题目索引
            currentQuestionIndex = index;
            
            // 保存进度
            saveProgress();
        }

        // 更新进度
        function updateProgress() {
            const answeredCount = userAnswers.filter(answer => answer !== null).length;
            progress.textContent = `进度: ${answeredCount}/${totalQuestions}`;
        }

        // 更新快速导航
        function updateQuickNav() {
            quickNav.innerHTML = "";
            
            for (let i = 0; i < currentQuestions.length; i++) {
                const btn = document.createElement('button');
                btn.textContent = i + 1;
                
                if (userAnswers[i] !== null) {
                    btn.classList.add('answered');
                }
                
                if (i === currentQuestionIndex) {
                    btn.classList.add('current');
                }
                
                btn.addEventListener('click', () => {
                    showQuestion(i);
					updateProgress();  // 添加这一行
                });
                
                quickNav.appendChild(btn);
            }
        }

        // 开始计时器
        function startTimer() {
            // 清除现有计时器
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            
            // 更新开始时间
            const startTimeStr = testStartTime.toLocaleTimeString();
            startTime.textContent = startTimeStr;
            
            // 更新已用时间
            timerInterval = setInterval(() => {
                const now = new Date();
                const elapsed = Math.floor((now - testStartTime) / 1000);
                
                const hours = Math.floor(elapsed / 3600);
                const minutes = Math.floor((elapsed % 3600) / 60);
                const seconds = elapsed % 60;
                
                elapsedTime.textContent = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }

        // 上一题
        function goToPrevQuestion() {
            if (currentQuestionIndex > 0) {
                showQuestion(currentQuestionIndex - 1);
            }
        }

        // 下一题
        function goToNextQuestion() {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                showQuestion(currentQuestionIndex + 1);
            }
        }

        // 提交测试
        function submitTest() {
            // 检查是否所有题目都已作答
            const unansweredCount = userAnswers.filter(answer => answer === null).length;
            
            if (unansweredCount > 0) {
                if (!confirm(`您还有 ${unansweredCount} 道题目未作答，确定要交卷吗？`)) {
                    return;
                }
            }
            
            // 停止计时器
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            
            // 计算分数
            let correctCount = 0;
            const wrongQuestionsList = [];
            
            for (let i = 0; i < currentQuestions.length; i++) {
                if (userAnswers[i] === currentQuestions[i].answer) {
                    correctCount++;
                } else {
                    wrongQuestionsList.push({
                        index: i,
                        question: currentQuestions[i],
                        userAnswer: userAnswers[i]
                    });
                }
            }
            
            const score = Math.round((correctCount / currentQuestions.length) * 100);
            
            // 显示结果
            showResults(score, correctCount, wrongQuestionsList);
            
            // 重置测试状态
            testInProgress = false;
            saveProgress();
        }

        // 显示结果
        function showResults(score, correctCount, wrongQuestionsList) {
            // 隐藏题目容器
            document.querySelector('.question-container').style.display = 'none';
            document.querySelector('.navigation').style.display = 'none';
            document.querySelector('.time-info').style.display = 'none';
            document.querySelector('.quick-nav').style.display = 'none';
            document.querySelector('.question-count-selector').style.display = 'none';
            document.querySelector('.progress').style.display = 'none';
            
            // 显示结果容器
            resultContainer.style.display = 'block';
            
            // 更新统计信息
            statistics.innerHTML = `
                <h3>测试统计</h3>
                <p>总分: <span class="${score >= 60 ? 'correct' : 'incorrect'}">${score}分</span></p>
                <p>正确题数: ${correctCount}/${totalQuestions}</p>
                <p>用时: ${elapsedTime.textContent}</p>
            `;
            
            // 更新错题信息
            if (wrongQuestionsList.length > 0) {
                let wrongQuestionsHTML = '<h3>错题解析</h3>';
                
                wrongQuestionsList.forEach(item => {
                    wrongQuestionsHTML += `
                        <div class="wrong-question">
                            <p><strong>${item.index + 1}. ${item.question.question}</strong></p>
                            <p>你的答案: <span class="incorrect">${item.userAnswer || '未作答'}</span></p>
                            <p>正确答案: <span class="correct">${item.question.answer}</span></p>
                            <p class="explanation">解析: ${item.question.explanation}</p>
                        </div>
                    `;
                });
                
                wrongQuestions.innerHTML = wrongQuestionsHTML;
            } else {
                wrongQuestions.innerHTML = '<h3>恭喜你！全部答对！</h3>';
            }
        }

        // 返回首页
        function returnToHome() {
            // 重置所有状态
            currentQuestions = [];
            currentQuestionIndex = 0;
            userAnswers = [];
            testStartTime = null;
            totalQuestions = 0;
            testInProgress = false;
            
            // 清除本地存储
            localStorage.removeItem('testProgress');
            
            // 重新显示初始界面
            document.querySelector('.question-container').style.display = 'block';
            document.querySelector('.navigation').style.display = 'flex';
            document.querySelector('.time-info').style.display = 'block';
            document.querySelector('.quick-nav').style.display = 'flex';
            document.querySelector('.question-count-selector').style.display = 'block';
            document.querySelector('.progress').style.display = 'block';
            resultContainer.style.display = 'none';
            
            questionTitle.textContent = "请选择题目数量开始测试";
            optionsContainer.innerHTML = "";
            progress.textContent = "进度: 0/0";
            startTime.textContent = "--:--:--";
            elapsedTime.textContent = "00:00:00";
            quickNav.innerHTML = "";
        }

        // 保存进度到本地存储
        function saveProgress() {
            const progress = {
                currentQuestions,
                currentQuestionIndex,
                userAnswers,
                testStartTime: testStartTime ? testStartTime.getTime() : null,
                totalQuestions,
                testInProgress
            };
            
            localStorage.setItem('testProgress', JSON.stringify(progress));
        }

        // 从本地存储加载进度
        function loadProgress() {
            const savedProgress = localStorage.getItem('testProgress');
            
            if (savedProgress) {
                const progress = JSON.parse(savedProgress);
                
                currentQuestions = progress.currentQuestions;
                currentQuestionIndex = progress.currentQuestionIndex;
                userAnswers = progress.userAnswers;
                testStartTime = progress.testStartTime ? new Date(progress.testStartTime) : null;
                totalQuestions = progress.totalQuestions;
                testInProgress = progress.testInProgress;
            }
        }

        // 页面加载时初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
